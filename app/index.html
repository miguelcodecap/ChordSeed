.tools .tooltab:hover{background:rgba(232,216,114,.07)!important;color:#F3EBC4}
.tools .tooltab[aria-selected="true"]{background:linear-gradient(180deg,rgba(232,216,114,.2),rgba(232,216,114,.08))!important;color:#F7EDA8!important;box-shadow:inset 0 0 0 1px rgba(232,216,114,.45),0 0 18px rgba(232,216,114,.12)}
.tools .hs-a{width:30px;height:30px;font-size:17px;background:rgba(15,29,22,.96);border-color:#2F4A3B;box-shadow:0 0 0 4px rgba(10,21,16,.9)}
.tools .hs-l{left:4px}.tools .hs-r{right:4px}
.hs[data-fit="1"]>.hs-a{display:none!important}
.hs[data-fit="1"]>.chips,.hs[data-fit="1"]>.moodrow{-webkit-mask-image:none!important;mask-image:none!important}
@media (min-width:1241px){.tools .hs[data-fit="1"]>.chips{justify-content:space-between}}

/* starter progressions */
.starter{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:rgba(10,21,16,.6);border:1px dashed #2F4A3B}
.starter-t{font-size:14px;line-height:1.5;color:#C9D6C6}
.starter-row{display:flex;flex-wrap:wrap;gap:6px}
.starter-b{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 12px;border-radius:12px;border:1px solid #2F4A3B;background:#16271F;color:#EAF2E6;cursor:pointer;font:600 14px 'JetBrains Mono',monospace;transition:border-color .15s,background .15s}
.starter-b small{font:600 11px 'Figtree',sans-serif;color:#9FB3A4;letter-spacing:.02em}
.starter-b:hover{border-color:#E8D872;background:#1F2A17}
.moodfit{font:600 11px 'Figtree',sans-serif;padding:3px 8px;border-radius:99px;background:rgba(232,216,114,.12);color:#F0E39A;border:1px solid rgba(232,216,114,.35)}
/* Lumen in learn cards */
.lrn-card{position:relative}
.lrn-sage{position:absolute;left:16px;top:98px;width:80px;z-index:2}
.lrn-bubble{margin:0 0 4px 92px;min-height:184px;justify-content:center}
@media (max-width:640px){.lrn-sage{width:58px;left:10px;top:104px}.lrn-bubble{margin-left:62px;min-height:136px}}
/* desktop: scroll rows wrap, no arrows; phones keep swipe + arrows */
@media (min-width:900px){main .hs>.chips,main .hs>.moodrow,.lrn-modal .hs>.chips,.onb .hs>.chips,.onb .hs>.moodrow{flex-wrap:wrap!important;overflow:visible!important;-webkit-mask-image:none!important;mask-image:none!important}main .hs>.hs-a,.onb .hs>.hs-a{display:none!important}}

/* Learn toggle with clear on/off state */
.lbtn{gap:8px}
.lsw{position:relative;display:inline-block;width:30px;height:17px;border-radius:99px;background:#0A1510;border:1px solid #3B5A47;transition:background .2s,border-color .2s;flex:none}
.lsw-k{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#6E8577;transition:transform .2s,background .2s,box-shadow .2s}
.lsw-t{font:700 10.5px 'Figtree',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#7F9C87;min-width:2.6em;text-align:left}
.lbtn.is-on{border-color:#E8D872!important;color:#F7EDA8!important;background:linear-gradient(180deg,rgba(232,216,114,.2),rgba(232,216,114,.07))!important;box-shadow:0 0 0 1px rgba(232,216,114,.35),0 0 22px rgba(232,216,114,.25)}
.lbtn.is-on .lsw{background:rgba(232,216,114,.3);border-color:#E8D872}
.lbtn.is-on .lsw-k{transform:translateX(13px);background:#FFF6C8;box-shadow:0 0 8px rgba(232,216,114,.9)}
.lbtn.is-on .lsw-t{color:#F0E39A}
@media (max-width:640px){.lsw-t{display:none}}

/* ===== Scrollbars del bosque (dorado, finas) ===== */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:linear-gradient(90deg,transparent 5px,rgba(232,216,114,.10) 5px,rgba(232,216,114,.10) 7px,transparent 7px)}
::-webkit-scrollbar-thumb{border-radius:99px;border:3px solid transparent;background:linear-gradient(180deg,#F7EDA8,#D9BE62 45%,#8A6A24) padding-box;box-shadow:0 0 8px rgba(232,216,114,.5)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#FFF6C8,#E8D872 45%,#B8963A) padding-box}
::-webkit-scrollbar-corner{background:transparent}
@supports (-moz-appearance:none){html,.lrn-card,main *{scrollbar-width:thin;scrollbar-color:#B8963A transparent}}
.lrn-card{background:linear-gradient(180deg,#14261D,#0A140F)!important;border-color:#2F4A3B!important;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(232,216,114,.12)!important;scrollbar-gutter:stable}
.lrn-card::-webkit-scrollbar-track{margin:26px 0}

.xbtn{gap:6px;min-height:44px}
.xpro{font:700 9px 'Figtree',sans-serif;letter-spacing:.06em;padding:2px 5px;border-radius:6px;background:#2C3520;color:#E8D872}

/* account */
.acctbtn{gap:8px}
.acct-dot{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#0A1510;border:1px solid #3B5A47;font:700 12px 'Figtree',sans-serif;color:#C9D6C6}
.acctbtn.is-in .acct-dot{background:linear-gradient(180deg,#F7EDA8,#B8963A);color:#0E140A;border-color:#E8D872;box-shadow:0 0 10px rgba(232,216,114,.45)}
.acct-card{width:min(460px,100%)}
.acct-hero{display:flex;align-items:center;gap:8px}
.acct-sage{width:70px;margin:-10px -4px -14px -6px}
.acct-hero .sage-bubble{flex:1}
.acct-google{display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px;border-radius:12px;border:1px solid #3B5A47;background:#F3F1E8;color:#1A1F1A;font:600 15px 'Figtree',sans-serif;cursor:pointer}
.acct-google:hover{background:#FFFFFF}
.acct-or{display:flex;align-items:center;gap:10px;color:#7F9C87;font-size:12px}.acct-or::before,.acct-or::after{content:"";flex:1;height:1px;background:#24392E}
.acct-f{display:flex;flex-direction:column;gap:6px;font:600 12px 'Figtree',sans-serif;color:#9FB3A4;letter-spacing:.04em}
.acct-f input{min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid #2F4A3B;background:#0A1510;color:#EAF2E6;font:500 15px 'Figtree',sans-serif;outline:none}
.acct-f input:focus{border-color:#E8D872;box-shadow:0 0 0 3px rgba(232,216,114,.15)}
.acct-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.acct-link{all:unset;cursor:pointer;font:600 13px 'Figtree',sans-serif;color:#E8D872}.acct-link:hover{text-decoration:underline}
.acct-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(10,21,16,.6);border:1px solid #24392E;font-size:14px;color:#EAF2E6}
.acct-note{margin:0;padding:10px 12px;border-radius:12px;background:rgba(232,216,114,.08);border:1px solid rgba(232,216,114,.3);color:#F0E39A;font-size:13px;line-height:1.5}
.cloud-songs{display:flex;flex-direction:column;gap:6px}.cloud-row{display:flex;flex-wrap:wrap;gap:6px}
.cs-chip{display:inline-flex;align-items:center;border-radius:12px;border:1px solid #2F4A3B;background:#16271F;overflow:hidden}
.cs-load{all:unset;cursor:pointer;padding:7px 12px;font:600 13px 'JetBrains Mono',monospace;color:#EAF2E6}.cs-load:hover{color:#F0E39A}
.cs-del{all:unset;cursor:pointer;padding:7px 10px;color:#9FB3A4;border-left:1px solid #2F4A3B}.cs-del:hover{color:#FF9A9D}
@media (max-width:640px){.acct-lab{display:none}}

/* ===== Rendimiento: scroll fluido ===== */
.fo-atmo{contain:strict;transform:translateZ(0)}
.fo-fog,.fo-rays,.fo-cloud,.fo-moon{filter:none!important}
.fo-rays{animation:none!important;opacity:.7}
.fo-fog,.fo-cloud{will-change:transform}
.fo-cloud{background:radial-gradient(ellipse at 50% 50%,rgba(14,26,24,.7),rgba(14,26,24,.35) 35%,rgba(14,26,24,0) 70%)!important}
.fo-fly{box-shadow:0 0 8px 3px rgba(225,240,120,.55)!important;will-change:transform,opacity}
.fo-fly:nth-of-type(2n){display:none}
.panel,.snd,.start,.tools .hs{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.panel,.snd,.start{background:linear-gradient(180deg,rgba(18,34,27,.94),rgba(9,18,14,.96))!important}
.tools .hs{background:rgba(10,21,16,.94)!important}
body.cs-scrolling .fo-atmo *,body.cs-scrolling .sage{animation-play-state:paused!important}
</style>

gin/i.test(m)) return es ? 'Correo o contrase\u00f1a incorrectos.' : 'Wrong email or password.';\n  if (/already registered|already been registered/i.test(m)) return es ? 'Ese correo ya tiene cuenta. Inicia sesi\u00f3n.' : 'That email already has an account. Sign in instead.';\n  if (/at least 6|Password should/i.test(m)) return es ? 'La contrase\u00f1a debe tener al menos 6 caracteres.' : 'Password must be at least 6 characters.';\n  if (/Email not confirmed/i.test(m)) return es ? 'Confirma tu correo: te enviamos un enlace.' : 'Please confirm your email: we sent you a link.';\n  if (/valid email|invalid.*email/i.test(m)) return es ? 'Escribe un correo v\u00e1lido.' : 'Enter a valid email.';\n  if (/rate limit|too many/i.test(m)) return es ? 'Demasiados intentos. Espera un momento.' : 'Too many attempts. Please wait a moment.';\n  if (/provider is not enabled/i.test(m)) return es ? 'El inicio con Google a\u00fan no est\u00e1 activado.' : 'Google sign-in isn\u2019t enabled yet.';\n  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return es ? 'No hay conexi\u00f3n con el servidor. Prueba en la versi\u00f3n web.' : 'Can\u2019t reach the server. Try the web version.';\n  return m || (es ? 'Algo sali\u00f3 mal. Int\u00e9ntalo de nuevo.' : 'Something went wrong. Please try again.');\n}\n\nvar SAGE = { explain: '../assets/img/sage-explain.webp', think: '../assets/img/sage-think.webp', celebrate: '../assets/img/sage-celebrate.webp', encourage: '../assets/img/sage-encourage.webp', play: '../assets/img/sage-play.webp' };\nvar LESSONS = [\n  { id: 'notes',\n    es: { t: 'El sonido y las 12 notas', k: 'Toda la m\u00fasica que conoces est\u00e1 hecha con solo 12 notas.',\n      p: ['Una nota es simplemente un sonido m\u00e1s agudo (fino) o m\u00e1s grave (grueso). Piensa en una voz de ni\u00f1o frente a la voz de un se\u00f1or mayor.', 'En m\u00fasica solo hay 12 notas distintas. Cuando llegas a la 12.\u00aa y sigues subiendo, vuelves a empezar con la primera, pero m\u00e1s aguda. A eso se le llama \u00absubir una octava\u00bb: es la misma nota, solo que m\u00e1s arriba.', 'Siete notas tienen nombre: C D E F G A B, que en espa\u00f1ol son Do Re Mi Fa Sol La Si. Las otras cinco est\u00e1n en medio y se nombran con # (sostenido = un poquito m\u00e1s aguda) o b (bemol = un poquito m\u00e1s grave). Ojo: C# y Db son la misma nota con dos nombres.'],\n      w: 'Toca cada nota. Al final escucha la misma nota grave y aguda: suenan distinto, pero se nota que son \u00abla misma\u00bb.',\n      q: '\u00bfCu\u00e1ntas notas distintas hay antes de que se repitan?', o: ['7', '12', '8'], a: 1, e: '12: las 7 con nombre (C D E F G A B) m\u00e1s las 5 con # o b. Despu\u00e9s se repiten, solo que m\u00e1s agudas.' },\n    en: { t: 'Sound and the 12 notes', k: 'All the music you know is made from just 12 notes.',\n      p: ['A note is simply a sound that is higher (thin) or lower (deep). Think of a child\u2019s voice next to a grown man\u2019s voice.', 'There are only 12 different notes in music. When you reach the 12th and keep going up, you start over with the first one, just higher. That\u2019s called \u201cgoing up an octave\u201d: same note, higher up.', 'Seven notes have names: C D E F G A B. The other five sit in between and use # (sharp = a little higher) or b (flat = a little lower). Heads up: C# and Db are the same note with two names.'],\n      w: 'Tap each note. At the end, hear the same note low and high: they sound different, but you can tell they\u2019re \u201cthe same\u201d.',\n      q: 'How many different notes are there before they repeat?', o: ['7', '12', '8'], a: 1, e: '12: the 7 named ones (C D E F G A B) plus the 5 with # or b. After that they repeat, just higher.' } },\n  { id: 'inst',\n    es: { t: 'Las notas en tu instrumento', k: 'Cada traste o cada tecla es la nota siguiente. As\u00ed de f\u00e1cil.',\n      p: ['En la guitarra, cada traste que avanzas es la nota siguiente de las 12. Si cuentas 12 trastes, vuelves a la misma nota de la cuerda al aire, pero m\u00e1s aguda.', 'Las cuerdas sin pisar (al aire), de la m\u00e1s gruesa a la m\u00e1s fina, son E A D G B E. Un truco para recordarlo: \u00abMi Abuela Dice Guarda Bien Eso\u00bb.', 'El piano funciona igual: cada tecla, blanca o negra, es la nota siguiente. Las blancas son las 7 notas con nombre y las negras son las notas con # o b.'],\n      w: 'Explora: toca cualquier traste o tecla para o\u00edrla y ver c\u00f3mo se llama.',\n      q: 'Si la cuerda m\u00e1s gruesa al aire es E, \u00bfqu\u00e9 nota suena en el traste 5?', o: ['G', 'A', 'B'], a: 1, e: 'Cuenta un traste por nota: E \u2192 F \u2192 F# \u2192 G \u2192 G# \u2192 A. En el traste 5 llegas a A, que es justo la cuerda siguiente al aire.' },\n    en: { t: 'The notes on your instrument', k: 'Each fret or key is simply the next note. That\u2019s it.',\n      p: ['On guitar, every fret you move up is the next of the 12 notes. Count 12 frets and you\u2019re back to the open-string note, just higher.', 'The strings played without pressing (open), from thickest to thinnest, are E A D G B E. A trick to remember it: \u201cEddie Ate Dynamite, Good Bye Eddie\u201d.', 'Piano works the same way: every key, white or black, is the next note. White keys are the 7 named notes; black keys are the ones with # or b.'],\n      w: 'Explore: tap any fret or key to hear it and see its name.',\n      q: 'If the thickest open string is E, which note is at fret 5?', o: ['G', 'A', 'B'], a: 1, e: 'Count one fret per note: E \u2192 F \u2192 F# \u2192 G \u2192 G# \u2192 A. At fret 5 you reach A, which is exactly the next open string.' } },\n  { id: 'int',\n    es: { t: 'La distancia entre notas', k: 'Qu\u00e9 tan lejos est\u00e1n dos notas decide si suenan bonito o raro juntas.',\n      p: ['La distancia m\u00e1s peque\u00f1a entre dos notas es un semitono: un solo traste o la tecla de al lado. Dos semitonos juntos forman un tono.', 'A la distancia entre dos notas se le llama intervalo. Algunas distancias suenan tranquilas y agradables, y otras suenan tensas o \u00abchocan\u00bb, como cuando alguien canta desafinado.', '\u00bfPor qu\u00e9 importa? Porque los acordes y las escalas son solo grupos de notas a ciertas distancias. Entender las distancias es entender por qu\u00e9 algo suena alegre, triste o tenso.'],\n      w: 'Elige una distancia desde C y escucha las dos notas juntas. \u00bfCu\u00e1les te suenan tranquilas y cu\u00e1les tensas?',\n      q: '\u00bfCu\u00e1ntos semitonos hay en un tono?', o: ['1', '2', '3'], a: 1, e: 'Un tono = 2 semitonos. En la guitarra, son dos trastes.' },\n    en: { t: 'The distance between notes', k: 'How far apart two notes are decides whether they sound nice or odd together.',\n      p: ['The smallest distance between two notes is a half step: one fret, or the very next key. Two half steps make a whole step.', 'The distance between two notes is called an interval. Some distances sound calm and pleasant; others sound tense or \u201cclash\u201d, like someone singing out of tune.', 'Why does it matter? Because chords and scales are just groups of notes at certain distances. Understanding distances is understanding why something sounds happy, sad or tense.'],\n      w: 'Pick a distance from C and hear both notes together. Which ones sound calm, and which sound tense?',\n      q: 'How many half steps are in a whole step?', o: ['1', '2', '3'], a: 1, e: 'A whole step = 2 half steps. On guitar, that\u2019s two frets.' } },\n  { id: 'scale',\n    es: { t: 'La escala mayor', k: 'Una \u00abreceta\u00bb de saltos que siempre suena a Do Re Mi.',\n      p: ['Una escala es un grupo de 7 notas elegidas de entre las 12, tocadas en orden. Es como elegir los colores que vas a usar en un dibujo. La m\u00e1s com\u00fan es la escala mayor.', 'La escala mayor siempre sigue la misma receta de saltos: tono, tono, semitono, tono, tono, tono, semitono. Si empiezas en C, te salen C D E F G A B: solo teclas blancas.', 'Si empiezas en otra nota y sigues la misma receta, obtienes la escala mayor de esa nota. Por ejemplo, G mayor necesita un F# en lugar de F para que la receta salga bien.'],\n      w: 'Elige la nota de inicio y mira c\u00f3mo la receta decide qu\u00e9 notas entran.',\n      q: 'En la escala de G mayor, \u00bfqu\u00e9 nota lleva sostenido (#)?', o: ['C#', 'F#', 'G#'], a: 1, e: 'G A B C D E F#. El \u00faltimo salto tiene que ser de solo un semitono para llegar a G, as\u00ed que F sube a F#.' },\n    en: { t: 'The major scale', k: 'A \u201crecipe\u201d of steps that always sounds like Do Re Mi.',\n      p: ['A scale is a group of 7 notes picked from the 12, played in order. It\u2019s like choosing which colors you\u2019ll use for a drawing. The most common one is the major scale.', 'The major scale always follows the same recipe of steps: whole, whole, half, whole, whole, whole, half. Start on C and you get C D E F G A B: only white keys.', 'Start on any other note, follow the same recipe, and you get that note\u2019s major scale. For example, G major needs F# instead of F so the recipe works out.'],\n      w: 'Pick a starting note and see how the recipe decides which notes get in.',\n      q: 'In the G major scale, which note is sharp (#)?', o: ['C#', 'F#', 'G#'], a: 1, e: 'G A B C D E F#. The last step must be just a half step to land on G, so F moves up to F#.' } },\n  { id: 'chord',\n    es: { t: 'C\u00f3mo se forma un acorde', k: 'Un acorde son 3 notas sonando a la vez. Se arma saltando de una en una.',\n      p: ['Para armar un acorde: elige una nota (la ra\u00edz), salta la siguiente, toma la otra, vuelve a saltar y toma otra m\u00e1s. Con C ser\u00eda: C (saltas D) E (saltas F) G. Resultado: C E G, el acorde de C.', 'La nota del medio decide el \u00abhumor\u00bb del acorde. Si est\u00e1 a 4 semitonos de la ra\u00edz, el acorde es mayor y suena alegre. Si est\u00e1 a 3, es menor y suena triste.', 'Lo curioso es que entre alegre y triste solo cambia una nota, y solo un trastecito.'],\n      w: 'Elige una nota y si quieres mayor o menor: mira c\u00f3mo se apilan las notas y c\u00f3mo se toca en tu instrumento.',\n      q: '\u00bfQu\u00e9 notas forman el acorde de C mayor?', o: ['C D E', 'C E G', 'C F A'], a: 1, e: 'Empiezas en C, saltas D, tomas E, saltas F, tomas G: C E G.' },\n    en: { t: 'How a chord is built', k: 'A chord is 3 notes sounding together. You build it by skipping every other note.',\n      p: ['To build a chord: pick a note (the root), skip the next one, take the one after, skip again and take one more. With C: C (skip D) E (skip F) G. Result: C E G, the C chord.', 'The middle note sets the chord\u2019s \u201cmood\u201d. If it\u2019s 4 half steps above the root, the chord is major and sounds happy. If it\u2019s 3, it\u2019s minor and sounds sad.', 'The cool part: between happy and sad, only one note changes, and only by one fret.'],\n      w: 'Pick a note and whether you want major or minor: see how the notes stack up and how to play it.',\n      q: 'Which notes make a C major chord?', o: ['C D E', 'C E G', 'C F A'], a: 1, e: 'Start on C, skip D, take E, skip F, take G: C E G.' } },\n  { id: 'key',\n    es: { t: 'La familia de acordes de una canci\u00f3n', k: 'Cada canci\u00f3n usa una \u00abfamilia\u00bb de 7 acordes que se llevan bien entre s\u00ed.',\n      p: ['Si armas un acorde empezando en cada nota de la escala mayor, te salen 7 acordes. Esa es la familia de acordes de la tonalidad: los que suenan bien juntos en esa canci\u00f3n.', 'La familia siempre sale en el mismo orden: mayor, menor, menor, mayor, mayor, menor y uno especial (disminuido). Los m\u00fasicos los numeran del 1 al 7 con n\u00fameros romanos: I ii iii IV V vi vii\u00b0. May\u00fascula = mayor, min\u00fascula = menor.', '\u00bfPara qu\u00e9 los n\u00fameros? Para hablar de canciones en cualquier tono. \u00abI V vi IV\u00bb en C es C G Am F, y en G es G D Em C. Misma canci\u00f3n, otra altura.'],\n      w: 'Elige una tonalidad y escucha a sus 7 acordes de la familia.',\n      q: 'En la tonalidad de C mayor, \u00bfcu\u00e1l es el acorde V (el n\u00famero 5)?', o: ['F', 'G', 'Am'], a: 1, e: 'Cuenta desde C: C (1), D (2), E (3), F (4), G (5). El V es G.' },\n    en: { t: 'A song\u2019s family of chords', k: 'Every song uses a \u201cfamily\u201d of 7 chords that get along with each other.',\n      p: ['Build a chord starting on each note of the major scale and you get 7 chords. That\u2019s the key\u2019s chord family: the chords that sound good together in that song.', 'The family always comes out in the same order: major, minor, minor, major, major, minor, and one special one (diminished). Musicians number them 1 to 7 with Roman numerals: I ii iii IV V vi vii\u00b0. Uppercase = major, lowercase = minor.', 'Why numbers? To talk about songs in any key. \u201cI V vi IV\u201d in C is C G Am F, and in G it\u2019s G D Em C. Same song, different height.'],\n      w: 'Pick a key and hear its 7 family chords.',\n      q: 'In the key of C major, which chord is V (number 5)?', o: ['F', 'G', 'Am'], a: 1, e: 'Count from C: C (1), D (2), E (3), F (4), G (5). V is G.' } },\n  { id: 'func',\n    es: { t: 'Casa, paseo y tensi\u00f3n', k: 'Cada acorde tiene un papel: descansar en casa, salir a pasear o querer volver.',\n      p: ['El acorde I es la casa: suena a calma y a final. (El vi y el iii se le parecen.)', 'El IV (y el ii) es salir a pasear: te aleja de casa y le da movimiento a la canci\u00f3n.', 'El V es la tensi\u00f3n: suena a \u00abfalta algo\u00bb y pide volver a casa. Por eso pasar del V al I suena a final de canci\u00f3n. Con esto ya entiendes c\u00f3mo funcionan las progresiones, y es justo lo que usa el generador.'],\n      w: 'Escucha la diferencia: un final que se queda en el aire y otro que vuelve a casa.',\n      q: '\u00bfQu\u00e9 acorde suena con m\u00e1s ganas de volver a casa (al I)?', o: ['IV', 'V', 'vi'], a: 1, e: 'El V: tiene una nota a solo un semitono de la casa, y tu o\u00eddo quiere que llegue.' },\n    en: { t: 'Home, journey and tension', k: 'Each chord has a role: resting at home, going for a walk, or wanting to come back.',\n      p: ['The I chord is home: it sounds calm and final. (The vi and iii feel similar.)', 'The IV (and the ii) is going for a walk: it takes you away from home and gives the song movement.', 'The V is tension: it sounds like \u201csomething\u2019s missing\u201d and wants to go home. That\u2019s why going from V to I sounds like the end of a song. Now you understand how progressions work, and that\u2019s exactly what the generator uses.'],\n      w: 'Hear the difference: an ending left hanging, and one that comes home.',\n      q: 'Which chord sounds most eager to go back home (to I)?', o: ['IV', 'V', 'vi'], a: 1, e: 'The V: it has a note just one half step from home, and your ear wants it to get there.' } }\n];\nvar IVL_NAMES = { 1:['2.\u00aa menor','minor 2nd','tenso'], 2:['2.\u00aa mayor','major 2nd','suave'], 3:['3.\u00aa menor','minor 3rd','triste'], 4:['3.\u00aa mayor','major 3rd','alegre'], 5:['4.\u00aa justa','perfect 4th','abierto'], 6:['tritono','tritone','muy tenso'], 7:['5.\u00aa justa','perfect 5th','estable'], 8:['6.\u00aa menor','minor 6th','melanc\u00f3lico'], 9:['6.\u00aa mayor','major 6th','dulce'], 10:['7.\u00aa menor','minor 7th','bluesero'], 11:['7.\u00aa mayor','major 7th','so\u00f1ador'], 12:['octava','octave','igual, pero m\u00e1s agudo'] };\nvar IVL_FEEL_EN = { 1:'tense', 2:'soft', 3:'sad', 4:'happy', 5:'open', 6:'very tense', 7:'stable', 8:'melancholic', 9:'sweet', 10:'bluesy', 11:'dreamy', 12:'the same note' };\nvar MAJ_STEPS = [2,2,1,2,2,2,1];\n\nvar GC_SUBS = [\n  [0, 'inst', '[data-g=\"inst\"]', '\u00bfQu\u00e9 instrumento tocas?', 'What do you play?', 'Elige tu instrumento. Vas a escuchar cada acorde con su sonido y a ver c\u00f3mo se toca en \u00e9l. Luego toca \u00abListo\u00bb.', 'Pick your instrument. You\u2019ll hear every chord with its sound and see how to play it on it. Then tap \u201cDone\u201d.', '', ''],\n  [0, 'genre', '[data-g=\"genre\"]', '\u00bfQu\u00e9 m\u00fasica quieres hacer?', 'What kind of music do you make?', 'Elige el estilo m\u00e1s parecido a lo que quieres crear. Cambia la bater\u00eda, el ritmo y el tipo de acordes que te sugerimos. Luego toca \u00abListo\u00bb.', 'Pick the style closest to what you want to make. It changes the drums, the rhythm and the kind of chords we suggest. Then tap \u201cDone\u201d.', '', ''],\n  [1, 'mood', '[data-g=\"mood\"]', '\u00bfC\u00f3mo quieres que se sienta?', 'How should it feel?', 'Elige una emoci\u00f3n: alegre, melanc\u00f3lica, \u00e9pica\u2026 Los acordes sugeridos se ordenan seg\u00fan ella. Prueba las que quieras; si a\u00fan no lo sabes, deja \u00abAny\u00bb. Cuando la tengas, toca \u00abListo\u00bb.', 'Pick an emotion: happy, melancholic, epic\u2026 The suggested chords are ranked by it. Try as many as you like, or keep \u201cAny\u201d if you\u2019re not sure. When you have it, tap \u201cDone\u201d.', 'Dejar \u00abAny\u00bb', 'Keep \u201cAny\u201d'],\n  [1, 'cx', '[data-g=\"cx\"]', '\u00bfAcordes simples o con m\u00e1s color?', 'Simple chords or more color?', '\u00abTriads\u00bb son los acordes b\u00e1sicos de 3 notas, ideales para empezar. Con + les sumas notas (como 7 o 9) que suenan m\u00e1s ricas y jazzeras. Ajusta con \u2212 y + y toca \u00abListo\u00bb.', '\u201cTriads\u201d are basic 3-note chords, perfect to start. Press + to add notes (like 7 or 9) that sound richer and jazzier. Adjust with \u2212 and +, then tap \u201cDone\u201d.', 'As\u00ed est\u00e1 bien', 'This is fine'],\n  [1, 'sur', '[data-g=\"sur\"]', '\u00bfQuieres sorpresas?', 'Want surprises?', '\u00abNone\u00bb solo usa acordes de la familia de tu canci\u00f3n. \u00abSome\u00bb de vez en cuando mete uno de afuera que da un giro inesperado. Ajusta con \u2212 y + y toca \u00abListo\u00bb.', '\u201cNone\u201d only uses chords from your song\u2019s family. \u201cSome\u201d now and then adds one from outside for an unexpected twist. Adjust with \u2212 and +, then tap \u201cDone\u201d.', 'As\u00ed est\u00e1 bien', 'This is fine'],\n  [1, 'count', '[data-g=\"count\"]', '\u00bfCu\u00e1ntos acordes te sugerimos?', 'How many chords should we suggest?', 'Con 1 eliges el siguiente acorde paso a paso. Con m\u00e1s, te proponemos frases completas de varios acordes de una vez. Usa + las veces que quieras y luego toca \u00abListo\u00bb.', 'With 1 you pick the next chord step by step. With more, we suggest whole phrases of several chords at once. Press + as many times as you like, then tap \u201cDone\u201d.', 'As\u00ed est\u00e1 bien', 'This is fine'],\n  [2, 'add', '#stp-2 .addtile', 'Pon los acordes que ya tienes', 'Add the chords you already have', 'Toca \u00abAdd chord\u00bb, elige la nota y el tipo, y agr\u00e9galo. Hazlo en el orden en que suenan. \u00bfNo tienes ninguno? Toca una de las ideas de abajo.', 'Tap \u201cAdd chord\u201d, pick the note and the type, and add it. Go in the order they play. Don\u2019t have any? Tap one of the ideas below.', '', ''],\n  [3, 'sugs', '#stp-3', 'Escucha y elige el siguiente', 'Listen and pick the next one', 'Estos acordes encajan despu\u00e9s de los tuyos. Toca \u25b6 para o\u00edr c\u00f3mo suena con tu progresi\u00f3n y + para agregarlo.', 'These chords fit after yours. Tap \u25b6 to hear how it sounds with your progression and + to add it.', 'Saltar este paso', 'Skip this step'],\n  [4, 'songs', '#stp-5', 'Canciones que usan tus acordes', 'Songs that use your chords', 'Escucha canciones reales con tu misma progresi\u00f3n. Toca \u25b6 para o\u00edrlas con su ritmo, o usa una como parte nueva de tu canci\u00f3n.', 'Hear real songs with your same progression. Tap \u25b6 to hear them with their rhythm, or use one as a new part of your song.', 'Saltar este paso', 'Skip this step']\n];\nvar GD_STEPS = [\n  ['Tu sonido', 'Your sound', 'Elige tu instrumento y tu estilo.', 'Choose your instrument and style.', 'stp-0', 'start'],\n  ['C\u00f3mo debe sonar', 'How it should feel', 'Elige una emoci\u00f3n: las sugerencias se adaptan a ella.', 'Pick a mood: the suggestions adapt to it.', 'stp-1', 'snd'],\n  ['Tus acordes', 'Your chords', 'Agrega al menos dos acordes o empieza con una idea.', 'Add at least two chords, or start from an idea.', 'stp-2', 'prog'],\n  ['El siguiente acorde', 'The next chord', 'Escucha las sugerencias con \u25b6 y agrega una con +.', 'Listen to the suggestions with \u25b6 and add one with +.', 'stp-3', 'sugs'],\n  ['Canciones reales', 'Real songs', 'Escucha canciones con tus acordes y toma ideas.', 'Hear songs that use your chords and borrow ideas.', 'stp-5', 'songs']\n];\nvar NAV = [\n  ['gen','Generador de acordes','Chord generator',false,\n   'Escribe los acordes que ya tienes y te sugiere cu\u00e1les pueden venir despu\u00e9s, seg\u00fan la emoci\u00f3n que buscas, con su explicaci\u00f3n y c\u00f3mo se tocan.',\n   'Enter the chords you already have and get the ones that can come next, based on the mood you want, with explanations and how to play them.',\n   'Tienes C \u2013 G \u2013 Am y te propone F para un estribillo luminoso.','You have C \u2013 G \u2013 Am and it suggests F for a bright chorus.'],\n  ['ana','Analizador de progresiones','Progression analyzer',false,\n   'Pega los acordes de cualquier canci\u00f3n y te explica la tonalidad, el papel de cada acorde y los recursos que usa, como acordes prestados.',\n   'Paste the chords of any song and it explains the key, each chord\u2019s job and the tricks it uses, like borrowed chords.',\n   'Descubres por qu\u00e9 el bVII de tu canci\u00f3n favorita suena tan \u00e9pico.','Find out why the bVII in your favorite song sounds so epic.'],\n  ['scl','Escalas para improvisar','Scales to improvise',false,\n   'Te indica qu\u00e9 escala o modo tocar sobre cada acorde de tu progresi\u00f3n, con las notas marcadas en el m\u00e1stil y el teclado.',\n   'Shows which scale or mode to play over each chord in your progression, with the notes marked on the neck and keyboard.',\n   'So 1\uae30\",\"You have C \u2013 G \u2013 Am and it suggests F for a bright chorus.\":\"C \u2013 G \u2013 Am\uc774 \uc788\uc73c\uba74 \ubc1d\uc740 \ucf54\ub7ec\uc2a4\ub97c \uc704\ud574 F\ub97c \uc81c\uc548\ud574\uc694.\",\"Find out why the bVII in your favorite song sounds so epic.\":\"\uc88b\uc544\ud558\ub294 \ub178\ub798\uc758 bVII\uac00 \uc65c \uc6c5\uc7a5\ud55c\uc9c0 \uc54c\uc544\ubcf4\uc138\uc694.\",\"Over Am it marks the minor pentatonic for your solo.\":\"Am \uc704\uc5d0\uc11c \uc194\ub85c\uc6a9 \ub2e8\uc870 \ud39c\ud0c0\ud1a0\ub2c9\uc744 \ud45c\uc2dc\ud574\uc694.\",\"C \u2013 Am \u2013 F \u2013 G turns into neo-soul.\":\"C \u2013 Am \u2013 F \u2013 G\uac00 \ub124\uc624\uc18c\uc6b8\ub85c \ubc14\ub00c\uc5b4\uc694.\",\"Move from C major to E major for the last chorus.\":\"\ub9c8\uc9c0\ub9c9 \ucf54\ub7ec\uc2a4\uc5d0\uc11c C\uc7a5\uc870\uc5d0\uc11c E\uc7a5\uc870\ub85c \uc774\ub3d9.\",\"See the 6 ways to play Gmaj7.\":\"Gmaj7\uc744 \uce58\ub294 6\uac00\uc9c0 \ubc29\ubc95\uc744 \ubcf4\uc138\uc694.\",\"Standard guitar tuning in seconds.\":\"\uba87 \ucd08 \ub9cc\uc5d0 \uae30\ud0c0 \ud45c\uc900 \ud29c\ub2dd.\",\"Understand why G \u2192 C sounds like an ending.\":\"G \u2192 C\uac00 \uc65c \ub05d\ucc98\ub7fc \ub4e4\ub9ac\ub294\uc9c0 \uc774\ud574\ud558\uae30.\",\"Long\":\"\uae38\uac8c\",\"One ringing hit per chord\":\"\ucf54\ub4dc\ub9c8\ub2e4 \ud55c \ubc88, \uae38\uac8c \uc6b8\ub9bc\",\"Pulse\":\"\ubc15\uc790\",\"One hit on every beat\":\"\ub9e4 \ubc15\ub9c8\ub2e4 \ud55c \ubc88\",\"Eighths\":\"8\ubd84\uc74c\ud45c\",\"Fast, steady hits with energy (rock)\":\"\ube60\ub974\uace0 \uafb8\uc900\ud55c \uc5d0\ub108\uc9c0 (\ub85d)\",\"Syncopated\":\"\uc2f1\ucf54\ud398\uc774\uc158\",\"Hits that push ahead (pop, urban, bossa)\":\"\uc55e\ub2f9\uaca8\uc9c0\ub294 \ub9ac\ub4ec (\ud31d, \uc5b4\ubc18, \ubcf4\uc0ac)\",\"Note by note, like fingerpicking\":\"\ud551\uac70\ud53c\ud0b9\ucc98\ub7fc \ud55c \uc74c\uc529\",\"Off-beat\":\"\uc624\ud504\ube44\ud2b8\",\"Bass on the beat, chord on the off-beat (reggae)\":\"\ubc15\uc5d0\ub294 \ubca0\uc774\uc2a4, \uc5c7\ubc15\uc5d0\ub294 \ucf54\ub4dc (\ub808\uac8c)\",\"Shuffle\":\"\uc154\ud50c\",\"Swung eighths (blues, jazz)\":\"\uc2a4\uc719 8\ubd84\uc74c\ud45c (\ube14\ub8e8\uc2a4, \uc7ac\uc988)\",\"No name\":\"\uc774\ub984 \uc5c6\uc74c\",\"Intro\":\"\uc778\ud2b8\ub85c\",\"Verse\":\"\ubc8c\uc2a4\",\"Pre-chorus\":\"\ud504\ub9ac\ucf54\ub7ec\uc2a4\",\"Chorus\":\"\ucf54\ub7ec\uc2a4\",\"Outro\":\"\uc544\uc6c3\ud2b8\ub85c\",\"Triads\":\"3\ud654\uc74c\",\"Sus & add\":\"Sus\uc640 add\",\"Sixths\":\"6\ud654\uc74c\",\"Sevenths\":\"7\ud654\uc74c\",\"Ninths\":\"9\ud654\uc74c\",\"Extended\":\"\ud655\uc7a5 \ud654\uc74c\",\"None\":\"\uc5c6\uc74c\",\"Some\":\"\uc870\uae08\",\"Lots\":\"\ub9ce\uc774\",\"Any\":\"\uc804\uccb4\",\"Modern pop\":\"\ubaa8\ub358 \ud31d\",\"Bright add9 chords, simple and catchy.\":\"\ubc1d\uc740 add9 \ucf54\ub4dc, \ub2e8\uc21c\ud558\uace0 \uadc0\uc5d0 \uc3d9.\",\"Rock / alternative\":\"\ub85d / \uc5bc\ud130\ub108\ud2f0\ube0c\",\"Open and suspended chords that ring wide on guitar.\":\"\uae30\ud0c0\uc5d0\uc11c \ub113\uac8c \uc6b8\ub9ac\ub294 \uac1c\ubc29\u00b7\uc11c\uc2a4 \ucf54\ub4dc.\",\"Acoustic folk\":\"\uc5b4\ucfe0\uc2a4\ud2f1 \ud3ec\ud06c\",\"Open strings and suspended chords, intimate and natural.\":\"\uac1c\ubc29\ud604\uacfc \uc11c\uc2a4 \ucf54\ub4dc, \uce5c\ubc00\ud558\uace0 \uc790\uc5f0\uc2a4\ub7ec\uc6c0.\",\"Neo-soul / R&B\":\"\ub124\uc624\uc18c\uc6b8 / R&B\",\"Smooth, lush chords with 9ths and 13ths.\":\"9th\uc640 13th\uac00 \ub4e4\uc5b4\uac04 \ubd80\ub4dc\ub7fd\uace0 \ud48d\uc131\ud55c \ucf54\ub4dc.\",\"Lo-fi hip hop\":\"\ub85c\ud30c\uc774 \ud799\ud569\",\"Relaxed sevenths and ninths, perfect for a chill loop.\":\"\ud3b8\uc548\ud55c 7th\uc640 9th, \uce60\ud55c \ub8e8\ud504\uc5d0 \ub531.\",\"City pop\":\"\uc2dc\ud2f0 \ud31d\",\"80s Japanese pop: bright, sleek and jazzy.\":\"80\ub144\ub300 \uc77c\ubcf8 \ud31d: \ubc1d\uace0 \uc138\ub828\ub418\uace0 \uc7ac\uc9c0\ud568.\",\"Jazz\":\"\uc7ac\uc988\",\"Sevenths on every chord and ii\u2013V motion.\":\"\ubaa8\ub4e0 \ucf54\ub4dc\uc5d0 7th, ii\u2013V \uc6c0\uc9c1\uc784.\",\"Gospel\":\"\uac00\uc2a4\ud3a0\",\"Very rich and emotional, great with passing chords.\":\"\uc544\uc8fc \ud48d\uc131\ud558\uace0 \uac10\ub3d9\uc801, \uacbd\uacfc \ud654\uc74c\uacfc \uc798 \uc5b4\uc6b8\ub9bc.\",\"Funk\":\"\ud391\ud06c\",\"Dominant 9th chords with lots of groove, even on the tonic.\":\"\uadf8\ub8e8\ube0c \ub118\uce58\ub294 \ub3c4\ubbf8\ub10c\ud2b8 9th, \ud1a0\ub2c9\uae4c\uc9c0\ub3c4.\",\"Blues\":\"\ube14\ub8e8\uc2a4\",\"Dominant 7ths everywhere: the raw blues sound.\":\"\uc5b4\ub514\uc5d0\ub098 \ub3c4\ubbf8\ub10c\ud2b8 7th: \ub0a0\uac83\uc758 \ube14\ub8e8\uc2a4 \uc0ac\uc6b4\ub4dc.\",\"Bossa nova\":\"\ubcf4\uc0ac\ub178\ubc14\",\"Warm and relaxed, with sevenths and ninths.\":\"\ub530\ub73b\ud558\uace0 \uc5ec\uc720\ub85c\uc6b4 7th\uc640 9th.\",\"Bolero / Latin ballad\":\"\ubcfc\ub808\ub85c / \ub77c\ud2f4 \ubc1c\ub77c\ub4dc\",\"Romantic and classic, with sixths and ninths.\":\"6th\uc640 9th\uac00 \ub4e4\uc5b4\uac04 \ub85c\ub9e8\ud2f1\ud55c \ud074\ub798\uc2dd.\",\"Urban / reggaeton\":\"\uc5b4\ubc18 / \ub808\uac8c\ud1a4\",\"Smooth seventh-chord loops, dark and repetitive.\":\"\ubd80\ub4dc\ub7ec\uc6b4 7th \ucf54\ub4dc \ub8e8\ud504, \uc5b4\ub461\uace0 \ubc18\ubcf5\uc801.\",\"Hard rock\":\"\ud558\ub4dc \ub85d\",\"Metal\":\"\uba54\ud0c8\",\"Film / epic\":\"\uc601\ud654 / \uc5d0\ud53d\",\"Open and wide, made for soundtracks.\":\"\uc0ac\uc6b4\ub4dc\ud2b8\ub799\uc744 \uc704\ud55c \ub113\uace0 \uc5f4\ub9b0 \uc18c\ub9ac.\",\"Classical\":\"\ud074\ub798\uc2dd\",\"Clean triads and dominant 7ths, as in classical music.\":\"\ud074\ub798\uc2dd \uc74c\uc545\ucc98\ub7fc \uae54\ub054\ud55c 3\ud654\uc74c\uacfc \ub3c4\ubbf8\ub10c\ud2b8 7th.\",\"Piano\":\"\ud53c\uc544\ub178\",\"Acoustic guitar\":\"\uc5b4\ucfe0\uc2a4\ud2f1 \uae30\ud0c0\",\"Electric guitar\":\"\uc77c\ub809 \uae30\ud0c0\",\"Flute\":\"\ud50c\ub8e8\ud2b8\",\"Strings\":\"\ud604\uc545\",\"Synth\":\"\uc2e s to play for melodies or solos over your chords.\":\"\ub0b4 \ucf54\ub4dc \uc704\uc5d0\uc11c \uba5c\ub85c\ub514\ub098 \uc194\ub85c\uc5d0 \uc4f8 \uc74c.\",\"Swap a melody\u2019s chords for more colorful ones.\":\"\uba5c\ub85c\ub514\uc758 \ucf54\ub4dc\ub97c \ub354 \ub2e4\ucc44\ub85c\uc6b4 \ucf54\ub4dc\ub85c \ubc14\uafc9\ub2c8\ub2e4.\",\"Dictionary\":\"\uc0ac\uc804\",\"Any chord and how to play it.\":\"\ubaa8\ub4e0 \ucf54\ub4dc\uc640 \uc5f0\uc8fc\ubc95.\",\"Tune your instrument with the microphone.\":\"\ub9c8\uc774\ud06c\ub85c \uc545\uae30\ub97c \uc870\uc728\ud558\uc138\uc694.\",\"Short lessons, from your first note to chords.\":\"\uccab \uc74c\ubd80\ud130 \ucf54\ub4dc\uae4c\uc9c0, \uc9e7\uc740 \ub808\uc2a8.\",\"Find out how a song is built.\":\"\ub178\ub798\uac00 \uc5b4\ub5bb\uac8c \ub9cc\ub4e4\uc5b4\uc84c\ub294\uc9c0 \uc54c\uc544\ubcf4\uc138\uc694.\",\"What it does\":\"\ud558\ub294 \uc77c\",\"Why\":\"\uc774\uc720\",\"Major and minor\":\"\uc7a5\uc870\uc640 \ub2e8\uc870\",\"The 7 notes of the key. Over C \u2013 G \u2013 Am \u2013 F, C major works.\":\"\uc870\uc758 7\uac1c \uc74c. C \u2013 G \u2013 Am \u2013 F \uc704\uc5d0\uc11c\ub294 C\uc7a5\uc870\uac00 \uc5b4\uc6b8\ub824\uc694.\",\"Pentatonic\":\"\ud39c\ud0c0\ud1a0\ub2c9\",\"Modes\":\"\uc120\ubc95\",\"To give it a new feel: jazzier, darker or more emotional.\":\"\uc0c8\ub85c\uc6b4 \ub290\ub08c: \ub354 \uc7ac\uc9c0\ud558\uac8c, \ub354 \uc5b4\ub461\uac8c, \ub354 \uac10\uc131\uc801\uc73c\ub85c.\",\"How\":\"\ubc29\ubc95\",\"Pivot chord\":\"\ud53c\ubc97 \ucf54\ub4dc\",\"A chord that belongs to both keys makes a smooth bridge.\":\"\ub450 \uc870\uc5d0 \ubaa8\ub450 \uc18d\ud55c \ucf54\ub4dc\ub294 \ubd80\ub4dc\ub7ec\uc6b4 \ub2e4\ub9ac\uac00 \ub429\ub2c8\ub2e4.\",\"Dominant\":\"\ub3c4\ubbf8\ub10c\ud2b8\",\"Playing the new key\u2019s V announces it strongly.\":\"\uc0c8 \uc870\uc758 V\ub97c \uce58\uba74 \uac15\ud558\uac8c \uc608\uace0\ub429\ub2c8\ub2e4.\",\"Look up any chord and learn how to play it.\":\"\uc5b4\ub5a4 \ucf54\ub4dc 2191\":\"ine-edit sa itaas \u2191\",\"tap to edit\":\"i-tap para i-edit\",\"empty\":\"walang laman\",\"New part\":\"Bagong bahagi\",\"Let the app suggest one\":\"Hayaang magmungkahi ang app\",\"Same key, different character\":\"Parehong key, ibang karakter\",\"Copy of\":\"Kopya ng\",\"to vary it\":\"para baguhin\",\"Same, with a different ending\":\"Pareho, iba ang wakas\",\"Empty\":\"Walang laman\",\"Add your own chords\":\"Idagdag ang sarili mong mga chord\",\"Name of part\":\"Pangalan ng bahaging\",\"\u21bb Another idea for\":\"\u21bb Ibang ideya para sa\",\"Remove part\":\"Alisin ang bahaging\",\"Song order\":\"Pagkakasunod ng kanta\",\"Remove block\":\"Alisin ang block\",\"Add at the end:\":\"Idagdag sa dulo:\",\"Start over\":\"Magsimula ulit\",\"Shortcuts\":\"Mga shortcut\",\"bars \u00b7\":\"bar \u00b7\",\"Less complexity\":\"Bawasan ang komplikasyon\",\"More complexity\":\"Dagdagan ang komplikasyon\",\"or\":\"o\",\"Less surprise\":\"Bawasan ang sorpresa\",\"More surprise\":\"Dagdagan ang sorpresa\",\"Fewer chords\":\"Mas kaunting chord\",\"More chords\":\"Mas maraming chord\",\"Sound like your progression \u00b7\":\"Kahawig ng progression mo \u00b7\",\"Your same progression, in another key \u00b7\":\"Parehong progression, ibang key \u00b7\",\"Other\":\"Iba pang\",\"songs in your key\":\"kanta sa iyong key\",\"Other genres with your progression\":\"Ibang genre na may progression mo\",\"songs\":\"kanta\",\"No songs of this genre in the list yet.\":\"Wala pang kanta sa genre na ito sa listahan.\",\"Similar:\":\"Kahawig:\",\"Show fewer\":\"Ipakita ang mas kaunti\",\"chords in a row\":\"chord nang sunod-sunod\",\"Your progression includes it\":\"Kasama ito sa progression mo\",\"Same key\":\"Parehong key\",\"In your key\":\"Sa iyong key\",\"Original in\":\"Orihinal sa\",\"With backing\":\"May saliw\",\"Only\":\"Tanging\",\"Each bar (\":\"Bawat bar (\",\") on\":\") sa\",\"Chord order (width = how long each lasts):\":\"Pagkakasunod ng chord (lapad = haba ng bawat isa):\",\"How to play the chords on your instrument (\":\"Paano tugtugin ang mga chord sa iyong instrumento (\",\"+ drums & bass\":\"+ drums at bass\",\"bars\":\"bar\",\"You have C \u2013 G \u2013 Am and it suggests F for a bright chorus.\":\"May C \u2013 G \u2013 Am ka at nagmumungkahi ito ng F para sa maliwanag na chorus.\",\"Find out why the bVII in your favorite song sounds so epic.\":\"Alamin kung bakit epiko ang bVII sa paborito mong kanta.\",\"Over Am it marks the minor pentatonic for your solo.\":\"Sa Am, minamarkahan nito ang minor pentatonic para sa solo mo.\",\"C \u2013 Am \u2013 F \u2013 G turns into neo-soul.\":\"Nagiging neo-soul ang C \u2013 Am \u2013 F \u2013 G.\",\"Move from C major to E major for the last chorus.\":\"Lumipat mula C major papuntang E major sa huling chorus.\",\"See the 6 ways to play Gmaj7.\":\"Tingnan ang 6 na paraan ng pagtugtog ng Gmaj7.\",\"Standard guitar tuning in seconds.\":\"Standard na tuning ng gitara sa ilang segundo.\",\"Understand why G \u2192 C sounds like an ending.\":\"Unawain kung bakit parang wakas ang G \u2192 C.\",\"Long\":\"Mahaba\",\"One ringing hit per chord\":\"Isang tumutunog na tira bawat chord\",\"Pulse\":\"Pulso\",\"One hit on every beat\":\"Isang tira sa bawat beat\",\"Fast, steady hits with energy (rock)\":\"Mabilis at tuloy-tuloy na tira na may enerhiya (rock)\",\"Hits that push ahead (pop, urban, bossa)\":\"Mga tirang nauuna (pop, urban, bossa)\",\"Note by note, like fingerpicking\":\"Isa-isang nota, parang fingerpicking\",\"Bass on the beat, chord on the off-beat (reggae)\":\"Bass sa beat, chord sa off-beat (reggae)\",\"No name\":\"Walang pangalan\",\"Triads\":\"Triad\",\"Sus & add\":\"Sus at add\",\"Sixths\":\"Sixth\",\"Sevenths\":\"Seventh\",\"Ninths\":\"Ninth\",\"None\":\"Wala\",\"Some\":\"Ilan\",\"Lots\":\"Marami\",\"Any\":\"Kahit ano\",\"Modern pop\":\"Modernong pop\",\"Bright add9 chords, simple and catchy.\":\"Maliwanag na add9 chord, simple at madaling tandaan.\",\"Open and suspended chords that ring wide on guitar.\":\"Bukas at suspended na chord na malawak ang tunog sa gitara.\",\"Open strings and suspended chords, intimate and natural.\":\"Open string at suspended chord, malapit at natural.\",\"Smooth, lush chords with 9ths and 13ths.\":\"Malambot at mayamang chord na may 9th at 13th.\",\"Relaxed sevenths and ninths, perfect for a chill loop.\":\"Relax na 7th at 9th, swak sa chill na loop.\",\"80s Japanese pop: bright, sleek and jazzy.\":\"Japanese pop ng dekada 80: maliwanag, makinis at jazzy.\",\"Sevenths on every chord and ii\u2013V motion.\":\"Seventh sa bawat chord at galaw na ii\u2013V.\",\"Very rich and emotional, great with passing chords.\":\"Napakayaman at emosyonal, bagay sa passing chord.\",\"Dominant 9th chords with lots of groove, even on the tonic.\":\"Dominant 9th na chord na puno ng groove, pati sa tonic.\",\"Dominant 7ths everywhere: the raw blues sound.\":\"Dominant 7th kahit saan: ang hilaw na tunog ng blues.\",\"Warm and relaxed, with sevenths and ninths.\":\"Mainit at relax, may 7th at 9th.\",\"Romantic and classic, with sixths and ninths.\":\"Romantiko at klasiko, may 6th at 9th.\",\"Smooth seventh-chord loops, dark and repetitive.\":\"Malambot na loop ng 7th chord, madilim at paulit-ulit.\",\"Film / epic\":\"Pelikula / epiko\",\"Open and wide, made for soundtracks.\":\"Bukas at malawak, para sa soundtrack.\",\"Classical\":\"Klasikal\",\"Clean triads and dominant 7ths, as in classical music.\":\"Malinis na triad at dominant 7th, gaya ng klasikal na musika.\",\"Flute\":\"Plawta\",\"flute\":\"plawta\",\"2 bars\":\"2 bar\",\"4 bars\":\"4 bar\",\"2 beats\":\"2 beat\",\"3 beats\":\"3 beat\",\"Instrument and genre\":\"Instrumento at genre\",\"Why pick an instrument\":\"Bakit pumili ng instrumento\",\"Strings (violin)\":\"Strings (biyolin)\",\"Why does something sound happy or sad?\":\"Bakit may masaya at may malungkot na tunog?\",\"Major = bright\":\"Major = maliwanag\",\"Minor = intimate or sad\":\"Minor = malapit sa damdamin o malungkot\",\"Triads (3 notes)\":\"Triad (3 nota)\",\"The base: C = C, E, G. Used in rock, pop and folk.\":\"Ang base: C = C, E, G. Ginagamit sa rock, pop at folk.\",\"Sus and add\":\"Sus at add\",\"Sevenths (4 notes)\":\"Seventh (4 nota)\",\"Ninths and extended\":\"Ninth at extended\",\"Your chords\":\"Ang iyong mga chord\",\"Only chords from your key. Safe and familiar.\":\"Mga chord lang sa iyong key. Ligtas at pamilyar.\",\"Chords per suggestion\":\"Chord bawat mungkahi\",\"How many chords I suggest at once.\":\"Ilang chord ang imumungkahi ko nang sabay.\",\"2 or 4 chords\":\"2 o 4 na chord\",\"The key\":\"Ang key\",\"Functions\":\"Mga function\",\"Length\":\"Haba\",\"Starting ideas\":\"Mga panimulang ideya\",\"Rhythm decides how your chords sound over time.\":\"Ang ritmo ang nagpapasya kung paano tumutunog ang mga chord sa paglipas ng oras.\",\"Drums and bass\":\"Drums at bass\",\"Ideas to continue\":\"Mga ideya para ituloy\",\"I suggest which chords can come after yours and why.\":\"Nagmumungkahi ako kung anong chord ang puwedeng sumunod sa iyo at bakit.\",\"How I decide\":\"Paano ako nagpapasya\",\"The percentage\":\"Ang porsiyento\",\"Listen first\":\"Makinig muna\",\"Song structure\":\"Istruktura ng kanta\",\"A song is built from parts that repeat and contrast.\":\"Ang kanta ay binubuo ng mga bahaging umuulit at nagkakaiba.\",\"Builds tension toward the chorus.\":\"Nagpapataas ng tensyon papunta sa chorus.\",\"Common forms\":\"Karaniwang anyo\",\"Example songs\":\"Mga halimbawang kanta\",\"Same chords\":\"Parehong chord\",\"Another key\":\"Ibang key\",\"Chordseed has several tools. Each tab is one:\":\"Maraming tool ang Chordseed. Bawat tab ay isa:\",\"Enter your chords and get ideas to continue.\":\"Ilagay ang mga chord mo at kumuha ng ideya para ituloy.\",\"Paste a song\u2019s chords and see the key and each chord\u2019s job.\":\"I-paste ang chord ng kanta at tingnan ang key at papel ng bawat chord.\",\"Scales\":\"Mga scale\",\"Which notes to play for melodies or solos over your chords.\":\"Anong nota ang tutugtugin para sa melody o solo sa ibabaw ng chord mo.\",\"Swap a melody\u2019s chords for more colorful ones.\":\"Palitan ang chord ng melody ng mas makulay na chord.\",\"Dictionary\":\"Diksyunaryo\",\"Any chord and how to play it.\":\"Kahit anong chord at kung paano ito tugtugin.\",\"Tune your instrument with the microphone.\":\"I-tune ang instrumento gamit ang mikropono.\",\"Short lessons, from your first note to chords.\":\"Maiikling aralin, mula sa unang nota hanggang sa chord.\",\"Find out how a song is built.\":\"Alamin kung paano binuo ang isang kanta.\",\"What it does\":\"Ano ang ginagawa nito\",\"Why\":\"Bakit\",\"Major and minor\":\"Major at minor\",\"The 7 notes of the key. Over C \u2013 G \u2013 Am \u2013 F, C major works.\":\"Ang 7 nota ng key. Sa C \u2013 G \u2013 Am \u2013 F, bagay ang C major.\",\"Modes\":\"Mga mode\",\"To give it a new feel: jazzier, darker or more emotional.\":\"Para sa bagong dating: mas jazzy, mas madilim o mas emosyonal.\",\"How\":\"Paano\",\"A chord that belongs to both keys makes a smooth bridge.\":\"Ang chord na kabilang sa dalawang key ay makinis na tulay.\",\"Playing the new key\u2019s V announces it strongly.\":\"Ang pagtugtog ng V ng bagong key ay malakas na pahiwatig.\",\"Look up any chord and learn how to play it.\":\"Maghanap ng kahit anong chord at alamin kung paano tugtugin.\",\"Chord names\":\"Pangalan ng chord\",\"Tuning means adjusting each string to its exact note.\":\"Ang pag-tune ay pag-aayos ng bawat kuwerdas sa eksaktong nota.\",\"How it works\":\"Paano ito gumagana\",\"For whom\":\"Para kanino\",\"For beginners: no theory needed.\":\"Para sa baguhan: hindi kailangan ng teorya.\",\"Warm jazz clean\":\"Mainit na jazz clean\",\"Crunch (light overdrive)\":\"Crunch (bahagyang overdrive)\"}};\nvar CUR_LANG = 'en';\nfunction initLang() { var ok = ['en','es','zh','tl','vi','fr','ko'], v = null; try { v = new URLSearchParams(location.search).get('lang'); } catch (e) {} if (ok.indexOf(v) < 0) { try { v = localStorage.getItem('cs_lang'); } catch (e) {} } return ok.indexOf(v) >= 0 ? v : 'en'; }\nvar LANGS = [['es','Espa\u00f1ol'],['en','English'],['zh','\u4e2d\u6587'],['tl','Tagalog'],['vi','Ti\u1ebfng Vi\u1ec7t'],['fr','Fran\u00e7ais'],['ko','\ud55c\uad6d\uc5b4']];\nfunction trS(s) {\n  var d = I18N[CUR_LANG]; if (!d || typeof s !== 'string' || !s) return s;\n  var m = s.match(/^(\\s*)([\\s\\S]*?)(\\s*)$/), core = m[2];\n  if (!core) return s;\n  if (d[core] != null) return m[1] + d[core] + m[3];\n  var m2 = core.match(/^([^A-Za-z0-9\u00c0-\u00ff\u00bf\u00a1\u201c\"(]+)([\\s\\S]+)$/);\n  if (m2) { var c2 = m2[2].trim(); if (d[c2] != null) return m[1] + m2[1] + d[c2] + m[3]; }\n  var m3 = core.match(/^([\\s\\S]+?)(\\s*[\u25be\u25b4\u2026:]+)$/);\n  if (m3 && d[m3[1]] != null) return m[1] + d[m3[1]] + m3[2] + m[3];\n  if (core.indexOf(' \u00b7 ') > 0) return m[1] + core.split(' \u00b7 ').map(trS).join(' \u00b7 ') + m[3];\n  return s;\n}\nfunction LX(a, b) { return CUR_LANG === 'es' ? a : (CUR_LANG === 'en' ? b : trS(b)); }\nvar TR_SKIP = /style|Style|diag|Diag|cloud|Cloud|^key$|^id$|^d$|^pid$|^url$/;\nfunction trTree(v) {\n  if (typeof v === 'string') return trS(v);\n  if (Array.isArray(v)) return v.map(trTree);\n  if (v && typeof v === 'object' && Object.getPrototypeOf(v) === Object.prototype) { var o = {}; for (var k in v) o[k] = TR_SKIP.test(k) ? v[k] : trTree(v[k]); return o; }\n  return v;\n}\nvar LEARN = {\n  start: { es: ['Tu instrumento y tu estilo', 'Primero cu\u00e9ntame qu\u00e9 tocas y qu\u00e9 m\u00fasica te gusta. Con eso, todo lo dem\u00e1s se adapta a ti: el sonido, los dibujos de c\u00f3mo se toca y los acordes que te recomiendo.', [\n      ['\u00bfPor qu\u00e9 importa el instrumento?', 'Un mismo acorde se toca distinto en cada instrumento. Si eliges guitarra, te muestro d\u00f3nde poner los dedos en la guitarra; si eliges piano, qu\u00e9 teclas apretar. Y todo suena con ese instrumento.'],\n      ['Piano', 'Puedes tocar el acorde completo con una mano y la nota grave con la otra. Sirve para casi todo: pop, baladas, jazz, gospel.'],\n      ['Guitarra ac\u00fastica', 'Puedes rasguear (pasar la mano por todas las cuerdas) o tocar las notas una a una. Es la de las fogatas, el folk y el pop tranquilo.'],\n      ['Guitarra el\u00e9ctrica', 'Limpia suena suave (funk, R&B). Con distorsi\u00f3n suena fuerte y rasposa (rock, metal); ah\u00ed se usan \u00abpower chords\u00bb, acordes de solo dos notas.'],\n      ['Flauta', 'Solo suena una nota a la vez, as\u00ed que los acordes se tocan nota por nota, uno detr\u00e1s de otro.'],\n      ['Cuerdas (viol\u00edn)', 'Notas largas que llenan el fondo y dan emoci\u00f3n, como en las pel\u00edculas.'],\n      ['Sintetizador', 'Sonidos electr\u00f3nicos: pop actual, lo-fi y m\u00fasica electr\u00f3nica.'],\n      ['\u00bfY el estilo?', 'Seg\u00fan el estilo te recomiendo otros acordes (m\u00e1s sofisticados en jazz, m\u00e1s simples y potentes en rock), otro ritmo, otra bater\u00eda y canciones de ejemplo de ese estilo.']] ],\n    en: ['Your instrument and your style', 'First tell me what you play and what music you like. Then everything adapts to you: the sound, the drawings of how to play, and the chords I recommend.', [\n      ['Why does the instrument matter?', 'The same chord is played differently on each instrument. Pick guitar and I show where to put your fingers on the guitar; pick piano and I show which keys to press. And everything plays with that sound.'],\n      ['Piano', 'You can play the whole chord with one hand and a low note with the other. Works for almost anything: pop, ballads, jazz, gospel.'],\n      ['Acoustic guitar', 'You can strum (sweep your hand across all strings) or play the notes one by one. The campfire, folk and soft pop instrument.'],\n      ['Electric guitar', 'Clean, it sounds smooth (funk, R&B). With distortion it sounds loud and gritty (rock, metal), where \u201cpower chords\u201d of just two notes are used.'],\n      ['Flute', 'Plays only one note at a time, so chords are played note by note, one after another.'],\n      ['Strings (violin)', 'Long notes that fill the background and add emotion, like in movies.'],\n      ['Synth', 'Electronic sounds: modern pop, lo-fi and electronic music.'],\n      ['And the style?', 'Depending on your style I recommend different chords (fancier in jazz, simpler and stronger in rock), a different rhythm, drums and example songs.']] ],\n    demo: 'inst' },\n  mood: { es: ['\u00bfC\u00f3mo quieres que suene?', 'Aqu\u00ed eliges la emoci\u00f3n de tu canci\u00f3n. Los acordes que te recomiendo cambian seg\u00fan lo que elijas.', [\n      ['La regla b\u00e1sica', 'Los acordes mayores suenan alegres y luminosos. Los menores suenan tristes o \u00edntimos. Entre uno y otro solo cambia una nota. Escucha C y luego Cm.'],\n      ['Alegre', 'Usa sobre todo acordes mayores y vuelve seguido a \u00abcasa\u00bb. Ejemplo: C \u2013 G \u2013 Am \u2013 F.'],\n      ['Melanc\u00f3lico', 'Empieza o se apoya en un acorde menor. Curioso: Am \u2013 F \u2013 C \u2013 G tiene los mismos acordes que el alegre, pero empezar en Am lo vuelve nost\u00e1lgico.'],\n      ['\u00c9pico', 'Acordes grandes que van subiendo, como en el cine: Am \u2013 F \u2013 G.'],\n      ['So\u00f1ador', 'Acordes con una nota extra que queda \u00abflotando\u00bb (como Cmaj7). Suena suave, como en un sue\u00f1o.'],\n      ['Tenso', 'Acordes que suenan a \u00abalgo va a pasar\u00bb y piden resolverse.'],\n      ['Oscuro', 'Acordes menores con notas graves que van bajando, como Am \u2013 G \u2013 F \u2013 E.'],\n      ['Cualquiera', 'Si eliges \u00abCualquiera\u00bb, te recomiendo los acordes que mejor siguen a los tuyos, sin importar la emoci\u00f3n.']] ],\n    en: ['How should it sound?', 'Here you choose your song\u2019s emotion. The chords I recommend change based on what you pick.', [\n      ['The basic rule', 'Major chords sound happy and bright. Minor chords sound sad or intimate. Only one note changes between them. Listen to C, then Cm.'],\n      ['Happy', 'Mostly major chords that keep coming back \u201chome\u201d. Example: C \u2013 G \u2013 Am \u2013 F.'],\n      ['Melancholic', 'Starts on or leans on a minor chord. Fun fact: Am \u2013 F \u2013 C \u2013 G has the same chords as the happy one, but starting on Am makes it nostalgic.'],\n      ['Epic', 'Big chords climbing up, like in movies: Am \u2013 F \u2013 G.'],\n      ['Dreamy', 'Chords with an extra note that \u201cfloats\u201d (like Cmaj7). Soft, like a dream.'],\n      ['Tense', 'Chords that sound like \u201csomething is about to happen\u201d and want to resolve.'],\n      ['Dark', 'Minor chords with low notes walking down, like Am \u2013 G \u2013 F \u2013 E.'],\n      ['Any', 'Pick \u201cAny\u201d and I recommend whatever chords follow yours best, regardless of emotion.']] ],\n    demo: 'mood' },\n  cx: { es: ['\u00bfAcordes simples o con m\u00e1s color?', 'Decide cu\u00e1ntas notas tienen los acordes que te recomiendo. M\u00e1s notas = sonido m\u00e1s rico, pero m\u00e1s dif\u00edcil de tocar.', [\n      ['Simples (3 notas)', 'Los de toda la vida, como C = do, mi, sol. Perfectos para empezar, para rock, pop y folk.'],\n      ['Sus y add', 'Cambian o a\u00f1aden una nota (Csus4, Cadd9). Suenan abiertos y modernos.'],\n      ['Sextas', 'C6: suena dulce y retro, como un bolero.'],\n      ['S\u00e9ptimas (4 notas)', 'Cmaj7 suena suave, C7 suena a \u00abquiero moverme\u00bb, Am7 suena relajado. Muy usados en R&B, jazz y bossa nova.'],\n      ['Novenas y m\u00e1s', 'Acordes muy ricos y elegantes (Cmaj9, Am11). Neo-soul, gospel y jazz.'],\n      ['Tus acordes', 'Al cambiar el nivel te pregunto si quieres convertir los acordes que ya tienes o usarlo solo para las nuevas recomendaciones.']] ],\n    en: ['Simple chords or more color?', 'Decide how many notes the chords I recommend have. More notes = richer sound, but harder to play.', [\n      ['Simple (3 notes)', 'The classics, like C = C, E, G. Perfect to start, and for rock, pop and folk.'],\n      ['Sus and add', 'Change or add a note (Csus4, Cadd9). Open, modern sound.'],\n      ['Sixths', 'C6: sweet and retro.'],\n      ['Sevenths (4 notes)', 'Cmaj7 sounds soft, C7 sounds like \u201cI want to move\u201d, Am7 sounds relaxed. Common in R&B, jazz and bossa nova.'],\n      ['Ninths and beyond', 'Very rich, elegant chords (Cmaj9, Am11). Neo-soul, gospel and jazz.'],\n      ['Your chords', 'When you change the level, I ask whether to convert the chords you already have or use it only for new recommendations.']] ],\n    demo: 'cx' },\n  sur: { es: ['\u00bfQuieres sorpresas?', 'Cada canci\u00f3n tiene una \u00abfamilia\u00bb de 7 acordes que suenan bien juntos. Aqu\u00ed decides si te recomiendo tambi\u00e9n acordes de fuera de esa familia.', [\n      ['Ninguna', 'Solo acordes de la familia. Suena seguro y conocido.'],\n      ['Algunas', 'De vez en cuando un acorde \u00abprestado\u00bb que da un toque especial. Por ejemplo, en C mayor el Fm suena nost\u00e1lgico, como en muchas baladas.'],\n      ['Muchas', 'Acordes de fuera m\u00e1s seguido. M\u00e1s sorpresa y personalidad, menos predecible.'],\n      ['\u00bfPor qu\u00e9 funcionan?', 'Un acorde de fuera suena bien si comparte notas con los de al lado o si te lleva de vuelta a un acorde de la familia.']] ],\n    en: ['Want surprises?', 'Every song has a \u201cfamily\u201d of 7 chords that sound good together. Here you decide whether I also recommend chords from outside that family.', [\n      ['None', 'Only family chords. Safe and familiar.'],\n      ['Some', 'Now and then a \u201cborrowed\u201d chord that adds something special. In C major, Fm sounds nostalgic, like in many ballads.'],\n      ['Lots', 'Outside chords more often. More surprise and personality, less predictable.'],\n      ['Why do they work?', 'An outside chord sounds good if it shares notes with its neighbors or leads you back to a family chord.']] ],\n    demo: 'sur' },\n  count: { es: ['\u00bfCu\u00e1ntos acordes te propongo?', 'Elige si quieres ideas de un acorde o frases completas.', [\n      ['1 acorde', 'Solo el siguiente paso. Ideal para construir poco a poco y escuchar cada cambio.'],\n      ['2 o 4 acordes', 'Una frase completa que ya suena a canci\u00f3n. \u00datil para inventar una parte nueva, como el coro.']] ],\n    en: ['How many chords should I suggest?', 'Choose single-chord ideas or full phrases.', [\n      ['1 chord', 'Just the next step. Great for building little by little and hearing each change.'],\n      ['2 or 4 chords', 'A full phrase that already sounds like a song. Useful for inventing a new section, like the chorus.']] ] },\n  prog: { es: ['Tu progresi\u00f3n', 'Una progresi\u00f3n es la lista de acordes que se repite en tu canci\u00f3n. Es su esqueleto: la melod\u00eda y la letra van encima.', [\n      ['C\u00f3mo empezar', 'Si ya tienes acordes, ponlos en orden con \u00abA\u00f1adir acorde\u00bb. Si no tienes ninguno, elige una progresi\u00f3n famosa de las ideas para empezar, o cualquier acorde que te guste: yo te ayudo con el resto.'],\n      ['La tonalidad', 'Miro tus acordes y adivino en qu\u00e9 \u00abtono\u00bb est\u00e1s (por ejemplo, C mayor). Es como saber en qu\u00e9 barrio vive tu canci\u00f3n.'],\n      ['Los n\u00fameros (I, IV, V\u2026)', 'Indican qu\u00e9 lugar ocupa cada acorde en la familia. May\u00fascula = mayor, min\u00fascula = menor. Con n\u00fameros puedes tocar la misma progresi\u00f3n en cualquier tono.'],\n      ['Casa, paseo y tensi\u00f3n', 'Cada acorde tiene un papel: el I es la casa (calma), el IV es salir a pasear (movimiento) y el V es la tensi\u00f3n que pide volver a casa.'],\n      ['Cu\u00e1nto dura cada acorde', 'Con \u2212 y + decides cu\u00e1nto suena cada uno. Cambiar r\u00e1pido da energ\u00eda; cambiar lento da calma.']] ],\n    en: ['Your progression', 'A progression is the list of chords that repeats in your song. It\u2019s the skeleton: melody and lyrics go on top.', [\n      ['How to start', 'If you already have chords, add them in order with \u201cAdd chord\u201d. If you have none, pick a famous progression from the starting ideas, or any chord you like: I\u2019ll help with the rest.'],\n      ['The key', 'I look at your chords and figure out which \u201ckey\u201d you\u2019re in (e.g. C major). Think of it as the neighborhood your song lives in.'],\n      ['The numbers (I, IV, V\u2026)', 'They show each chord\u2019s place in the family. Uppercase = major, lowercase = minor. With numbers you can play the same progression in any key.'],\n      ['Home, journey and tension', 'Each chord has a role: I is home (calm), IV is going for a walk (movement) and V is tension that wants to go back home.'],\n      ['How long each chord lasts', 'Use \u2212 and + to set how long each one plays. Fast changes add energy; slow changes add calm.']] ],\n    demo: 'prog' },\n  rhythm: { es: ['Ritmo y velocidad', 'El ritmo decide c\u00f3mo suenan tus acordes en el tiempo: lento o r\u00e1pido, suave o con golpe.', [\n      ['Tempo (BPM)', 'Cu\u00e1ntos golpes por minuto. 70 = lento, como una balada. 120 = medio, como el pop. 170 = r\u00e1pido, como el punk.'],\n      ['Comp\u00e1s', '4/4 se cuenta 1-2-3-4 (casi todo el pop y rock). 3/4 se cuenta 1-2-3, como un vals. 6/8 se siente como un balanceo.'],\n      ['C\u00f3mo se toca', 'El mismo acorde cambia mucho seg\u00fan el patr\u00f3n: golpes parejos, notas sueltas (arpegio), golpes a contratiempo (reggae) o con swing (blues).'],\n      ['Bater\u00eda y bajo', 'A\u00f1aden el acompa\u00f1amiento t\u00edpico de tu estilo para que suene como una canci\u00f3n de verdad.']] ],\n    en: ['Rhythm and speed', 'Rhythm decides how your chords sound over time: slow or fast, soft or punchy.', [\n      ['Tempo (BPM)', 'Beats per minute. 70 = slow, like a ballad. 120 = medium, like pop. 170 = fast, like punk.'],\n      ['Time signature', '4/4 counts 1-2-3-4 (most pop and rock). 3/4 counts 1-2-3, like a waltz. 6/8 feels like swaying.'],\n      ['How it\u2019s played', 'The same chord changes a lot with the pattern: even strums, single notes (arpeggio), off-beat hits (reggae) or swing (blues).'],\n      ['Drums and bass', 'Add your style\u2019s typical backing so it sounds like a real song.']] ] },\n  sugs: { es: ['\u00bfQu\u00e9 acorde pongo despu\u00e9s?', 'Te recomiendo acordes que suenan bien despu\u00e9s de los tuyos, ordenados del que mejor encaja al que menos.', [\n      ['C\u00f3mo los elijo', 'Busco cambios que tu o\u00eddo ya conoce de mil canciones, como pasar de la tensi\u00f3n (V) a la casa (I).'],\n      ['Tu emoci\u00f3n cuenta', 'Si elegiste Alegre, Melanc\u00f3lico, etc., subo los acordes que transmiten esa emoci\u00f3n y bajo los que no.'],\n      ['El porcentaje', 'Qu\u00e9 tan bien encaja cada idea con tus acordes, tu emoci\u00f3n y tu estilo.'],\n      ['Escucha antes de elegir', 'Pulsa \u25b6 para o\u00edr la idea unida a tus acordes y qu\u00e9date con la que se parezca a lo que tienes en la cabeza.']] ],\n    en: ['Which chord comes next?', 'I recommend chords that sound good after yours, ordered from best fit to least.', [\n      ['How I pick them', 'I look for changes your ear already knows from a thousand songs, like going from tension (V) to home (I).'],\n      ['Your emotion counts', 'If you chose Happy, Melancholic, etc., I push up the chords that carry that emotion and push down the rest.'],\n      ['The percentage', 'How well each idea fits your chords, your emotion and your style.'],\n      ['Listen before choosing', 'Press \u25b6 to hear the idea after your chords and keep the one closest to what\u2019s in your head.']] ] },\n  struct: { es: ['Arma tu canci\u00f3n', 'Una canci\u00f3n se arma con partes: unas se repiten y otras cambian para que no aburra.', [\n      ['Verso', 'Cuenta la historia. Suele repetirse con distinta letra.'],\n      ['Pre-coro', 'Sube la emoci\u00f3n para preparar el coro.'],\n      ['Coro', 'La parte que todo el mundo canta y recuerda. Suele tener m\u00e1s energ\u00eda.'],\n      ['Puente', 'Un cambio de aire (otros acordes) antes del \u00faltimo coro.'],\n      ['C\u00f3mo se usa aqu\u00ed', 'Tu progresi\u00f3n es la parte A. Crea m\u00e1s partes (B, C\u2026) y ord\u00e9nalas: por ejemplo A A B A. Usa los atajos si no sabes por d\u00f3nde empezar.']] ],\n    en: ['Build your song', 'A song is built from parts: some repeat and some change so it doesn\u2019t get boring.', [\n      ['Verse', 'Tells the story. Usually repeats with different lyrics.'],\n      ['Pre-chorus', 'Builds up emotion to prepare the chorus.'],\n      ['Chorus', 'The part everyone sings and remembers. Usually more energy.'],\n      ['Bridge', 'A change of scenery (other chords) before the last chorus.'],\n      ['How to use it here', 'Your progression is part A. Create more parts (B, C\u2026) and order them, e.g. A A B A. Use the shortcuts if you don\u2019t know where to start.']] ] },\n  songs: { es: ['Canciones que usan tus acordes', 'Escuchar tus acordes en canciones famosas te ayuda a entender c\u00f3mo suenan y te da ideas.', [\n      ['Mismos acordes, otra canci\u00f3n', 'Cientos de \u00e9xitos usan los mismos 4 acordes. Lo que las hace distintas es la melod\u00eda, el ritmo y el sonido.'],\n      ['En otro tono', 'Una progresi\u00f3n puede sonar m\u00e1s aguda o m\u00e1s grave. Los n\u00fameros (I, V, vi\u2026) no cambian; solo los nombres de los acordes.'],\n      ['Tus acordes y los del compositor', 'Los acordes resaltados son los que t\u00fa pusiste; los punteados son los cambios que hizo el compositor.'],\n      ['C\u00f3mo se toca', 'Abre \u00abC\u00f3mo se toca\u00bb para ver el ritmo, el orden de los acordes y d\u00f3nde poner los dedos.']] ],\n    en: ['Songs that use your chords', 'Hearing your chords in famous songs helps you understand how they sound and gives you ideas.', [\n      ['Same chords, different song', 'Hundreds of hits use the same 4 chords. Melody, rhythm and sound make them different.'],\n      ['In another key', 'A progression can sound higher or lower. The numbers (I, V, vi\u2026) stay the same; only chord names change.'],\n      ['Your chords vs. the songwriter\u2019s', 'Highlighted chords are the ones you entered; dashed ones are changes the songwriter made.'],\n      ['How to play it', 'Open \u201cHow to play it\u201d to see the rhythm, chord order and finger positions.']] ] },\n  tools: { es: ['Las herramientas', 'Cada pesta\u00f1a es una herramienta distinta. Puedes usarlas en cualquier orden:', [\n      ['Generador de acordes', 'Pones tus acordes y te digo cu\u00e1l puede venir despu\u00e9s. Con \u00abAnalizar mi progresi\u00f3n\u00bb te explico por qu\u00e9 funciona.'],\n      ['Enriquecer mis acordes', 'Convierte tus acordes en versiones con m\u00e1s color, sin cambiar la idea.'],\n      ['Escalas para tu melod\u00eda', 'Qu\u00e9 notas puedes cantar o tocar encima de tus acordes sin que choquen.'],\n      ['Cambiar de tonalidad', 'C\u00f3mo pasar a otro tono a mitad de canci\u00f3n sin que suene forzado.'],\n      ['Diccionario', 'Busca cualquier acorde y mira c\u00f3mo se toca.'],\n      ['Afinador', 'Afina tu instrumento con el micr\u00f3fono.'],\n      ['Aprende desde cero', 'Siete lecciones cortas, desde la primera nota hasta entender los acordes.']] ],\n    en: ['The tools', 'Each tab is a different tool. Use them in any order:', [\n      ['Chord generator', 'Enter your chords and I tell you what can come next. \u201cAnalyze my progression\u201d explains why it works.'],\n      ['Enrich my chords', 'Turns your chords into more colorful versions without changing the idea.'],\n      ['Scales for your melody', 'Which notes you can sing or play over your chords without clashing.'],\n      ['Change key', 'How to move to another key mid-song without it sounding forced.'],\n      ['Dictionary', 'Look up any chord and see how to play it.'],\n      ['Tuner', 'Tune your instrument with the microphone.'],\n      ['Learn from scratch', 'Seven short lessons, from your first note to understanding chords.']] ] },\n  ana: { es: ['Analizar una progresi\u00f3n', 'Te explico c\u00f3mo est\u00e1 hecha una progresi\u00f3n, como si la desarm\u00e1ramos juntos.', [['Qu\u00e9 hace', 'Pones los acordes y te digo en qu\u00e9 tono est\u00e1n, qu\u00e9 papel cumple cada uno (casa, paseo o tensi\u00f3n) y si usa alg\u00fan truco especial.'], ['Para qu\u00e9 sirve', 'Para entender por qu\u00e9 te gusta una canci\u00f3n y usar esos mismos trucos en las tuyas.']]],\n    en: ['Analyze a progression', 'I explain how a progression is built, as if we took it apart together.', [['What it does', 'Enter chords and I tell you the key, each chord\u2019s role (home, journey or tension) and any special tricks.'], ['Why', 'To understand why you like a song and use the same tricks in yours.']]] },\n  scl: { es: ['Escalas para tu melod\u00eda', 'Una escala es el grupo de notas que puedes usar encima de tus acordes sin que choquen.', [['Mayor y menor', 'Las 7 notas del tono de tu canci\u00f3n. Sobre C \u2013 G \u2013 Am \u2013 F funciona la escala de C mayor.'], ['Pentat\u00f3nica', 'Solo 5 notas, quitando las que pueden chocar: es casi imposible equivocarse. La favorita para solos.'], ['Modos', 'Son la misma escala empezando en otra nota. Cada uno tiene su propio \u00abcolor\u00bb.']]],\n    en: ['Scales for your melody', 'A scale is the group of notes you can use over your chords without clashing.', [['Major and minor', 'The 7 notes of your song\u2019s key. Over C \u2013 G \u2013 Am \u2013 F, the C major scale works.'], ['Pentatonic', 'Only 5 notes, leaving out the ones that can clash: almost impossible to go wrong. The favorite for solos.'], ['Modes', 'The same scale starting on another note. Each has its own \u201ccolor\u201d.']]] },\n  rea: { es: ['Enriquecer tus acordes', 'Cambiar tus acordes por versiones con m\u00e1s color que encajan con la misma melod\u00eda.', [['Para qu\u00e9', 'Para darle a tu canci\u00f3n otro aire: m\u00e1s jazz, m\u00e1s oscura o m\u00e1s emotiva.'], ['C\u00f3mo', 'Uso acordes que comparten notas con los tuyos, as\u00ed la melod\u00eda sigue encajando. Por ejemplo, Am en lugar de C.']]],\n    en: ['Enrich your chords', 'Swap your chords for more colorful versions that fit the same melody.', [['Why', 'To give your song a new feel: jazzier, darker or more emotional.'], ['How', 'I use chords that share notes with yours, so the melody still fits. For example, Am instead of C.']]] },\n  mod: { es: ['Cambiar de tonalidad', 'Es cuando la canci\u00f3n \u00absube\u00bb a otro tono, como el cl\u00e1sico \u00faltimo coro que suena m\u00e1s alto y emocionante.', [['Acorde puente', 'Un acorde que pertenece a los dos tonos te lleva de uno a otro sin que se note.'], ['Anunciar el cambio', 'Tocar el acorde de tensi\u00f3n (V) del nuevo tono lo anuncia con fuerza.'], ['Tonos cercanos y lejanos', 'Los tonos vecinos comparten casi todas sus notas, as\u00ed que el cambio es suave. Cuanto m\u00e1s lejos, m\u00e1s llamativo.']]],\n    en: ['Change key', 'It\u2019s when the song \u201clifts\u201d into another key, like the classic last chorus that sounds higher and more exciting.', [['Bridge chord', 'A chord that belongs to both keys takes you from one to the other without it being noticed.'], ['Announce the change', 'Playing the new key\u2019s tension chord (V) announces it strongly.'], ['Near and far keys', 'Neighboring keys share almost all their notes, so the change is smooth. The farther away, the more striking.']]] },\n  dic: { es: ['Diccionario de acordes', 'Busca cualquier acorde y mira c\u00f3mo se toca, o al rev\u00e9s: aprieta notas y te digo qu\u00e9 acorde es.', [['C\u00f3mo leer un nombre', 'La letra es la nota principal (C, D\u2026). Lo que viene despu\u00e9s es el tipo: m = menor, 7 = s\u00e9ptima, maj7 = s\u00e9ptima mayor, sus4 = suspendido.'], ['Varias posiciones', 'Un mismo acorde se puede tocar en varios lugares del m\u00e1stil o del teclado. Elige el m\u00e1s c\u00f3modo
